name: CodeGraph impact comment
description: Comments on a pull request with the functions, files and tests that its changes can reach.
author: harsharajkumar-273
branding:
  icon: git-pull-request
  color: blue

inputs:
  github-token:
    description: "Token used to post the comment. The default needs `pull-requests: write` on the workflow."
    default: ${{ github.token }}
  min-confidence:
    description: "Weakest link to count (resolved, probable or ambiguous)."
    default: probable
  inline-comments:
    description: "Line comments on the diff for findings that have a line (a removed function still called, a signature that call sites no longer fit, public API removed). Use 'all' to add a note on edits to code many others depend on, or 'false' for none."
    default: 'true'
  anthropic-api-key:
    description: "Optional. An Anthropic API key (store it as a secret). When set, a model reads the diff and the description and adds a short reading of the change to the comment. Off when empty, and never used for a pull request from a fork. The source files of the diff and the description are sent to the Anthropic API."
    default: ''
  ai-model:
    description: "The model that writes the reading (default claude-sonnet-5-5)."
    default: ''
  fail-above:
    description: "Fail the check when more than this many symbols are affected. Leave empty to only comment."
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install CodeGraph
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund
    - name: Work out what the pull request can reach
      id: impact
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MIN: ${{ inputs.min-confidence }}
        WORKSPACE: ${{ github.workspace }}
        OUT: ${{ runner.temp }}/codegraph-comment.md
        INLINE: ${{ runner.temp }}/codegraph-inline.json
        WANT_INLINE: ${{ inputs.inline-comments }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CODEGRAPH_AI_MODEL: ${{ inputs.ai-model }}
        # A pull request from a fork is written by a stranger and cannot see secrets anyway: no model call for it.
        SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        CODEGRAPH_PR_TITLE: ${{ github.event.pull_request.title }}
        CODEGRAPH_PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [ -z "$BASE_SHA" ]; then echo "::error::Run this action on pull_request events."; exit 1; fi
        for sha in "$BASE_SHA" "$HEAD_SHA"; do
          if ! git -C "$WORKSPACE" cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "::error::A commit of the pull request is not in the checkout. Use actions/checkout with fetch-depth: 0."; exit 1
          fi
        done
        # Analyse the pull request's own commit, not the merge commit the checkout holds: GitHub numbers the lines of its diff
        # (merge base to head) from that commit, and inline comments must land on those lines.
        WT="$RUNNER_TEMP/codegraph-head"
        git -C "$WORKSPACE" worktree add --quiet --detach "$WT" "$HEAD_SHA" > /dev/null 2>&1
        EXTRA=""
        if [ "$WANT_INLINE" = "true" ]; then EXTRA="--inline-out $INLINE"; fi
        if [ "$WANT_INLINE" = "all" ]; then EXTRA="--inline-out $INLINE --inline-hotspots"; fi
        if [ -n "$ANTHROPIC_API_KEY" ] && [ "$SAME_REPO" = "true" ]; then EXTRA="$EXTRA --ai"; fi
        npx tsx packages/cli/src/bin.ts impact --diff --range "$BASE_SHA...$HEAD_SHA" --repo "$WT" \
          --min-confidence "$MIN" --format markdown $EXTRA > "$OUT"
        git -C "$WORKSPACE" worktree remove --force "$WT" || true
        # The headline number in the comment is "**N symbols in M files**"; no match means nothing was affected.
        N=$(grep -oE '\*\*[0-9]+ symbols?' "$OUT" | grep -oE '[0-9]+' | head -1 || true)
        echo "symbols=${N:-0}" >> "$GITHUB_OUTPUT"
        echo "file=$OUT" >> "$GITHUB_OUTPUT"
        if [ -s "$INLINE" ]; then echo "inline=$INLINE" >> "$GITHUB_OUTPUT"; fi
    - name: Post or update the comment
      if: steps.impact.outputs.file != ''
      uses: actions/github-script@v7
      env:
        FILE: ${{ steps.impact.outputs.file }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.FILE, 'utf8').trim();
          if (!body) { core.info('No changed source symbols, nothing to say.'); return; }
          const marker = '<!-- codegraph-impact -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
          } catch (e) {
            // Pull requests from forks get a read-only token. Show the result in the run summary instead.
            core.warning(`Could not post the comment (${e.message}). Writing it to the job summary instead.`);
            await core.summary.addRaw(body).write();
          }
    - name: Leave line comments on the diff
      if: steps.impact.outputs.inline != ''
      uses: actions/github-script@v7
      env:
        INLINE: ${{ steps.impact.outputs.inline }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const post = require(`${process.env.ACTION_PATH}/action/post-review.cjs`);
          const r = await post({ github, context, core, fs: require('fs'), file: process.env.INLINE });
          core.info(`Inline comments: ${r.posted} posted, ${r.kept} kept, ${r.removed} replaced.`);
    - name: Enforce the limit
      if: inputs.fail-above != '' && steps.impact.outputs.symbols != ''
      shell: bash
      env:
        SYMBOLS: ${{ steps.impact.outputs.symbols }}
        LIMIT: ${{ inputs.fail-above }}
      run: |
        if [ "$SYMBOLS" -gt "$LIMIT" ]; then echo "::error::This change can reach $SYMBOLS symbols, over the limit of $LIMIT."; exit 1; fi
